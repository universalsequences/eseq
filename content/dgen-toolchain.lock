# Hermetic dgen toolchains staged into tools/dgen-toolchain/ (gitignored).
# Archive identities are target-qualified: an archive for one platform or
# architecture must never satisfy another.
#
# A target may be staged two ways, and the presence of a `url` key is what
# says which:
#   url present  -- published and fetchable. scripts/fetch_dgen_toolchain.sh
#                   downloads it, verifies archive_sha256, and installs it. No
#                   dgen-audio checkout required.
#   url absent   -- vendored from a local dgen-audio checkout by
#                   ./rebuild_dgenlisp_tool.sh, which copies
#                   $DGEN_REPO/.toolchain/<archive> and records its identity
#                   here.
# Either way archive_sha256 is the pin and a mismatch is a hard error.
format_version 3

# Published and fetchable. Built from LLVM source by dgen-audio's
# scripts/build-toolchain.sh on an Apple Silicon host, which enforces the
# strings-based relocatability scan the repacked Linux stage below is exempt
# from. ./rebuild_dgenlisp_tool.sh still vendors the identical archive from a
# local dgen-audio checkout; both routes land on this same sha256.
target.arm64-apple-macos.archive dgen-toolchain-20.1.8-arm64.tar.gz
target.arm64-apple-macos.archive_sha256 3f5a813d50294df2fd55bf6e63562f491b7e0c3d4cf52c762995dc03f036d5ca
target.arm64-apple-macos.url https://github.com/universalsequences/dgen-audio/releases/download/dgen-toolchain-20.1.8/dgen-toolchain-20.1.8-arm64.tar.gz
target.arm64-apple-macos.llvm_version 20.1.8
target.arm64-apple-macos.dgen_abi_version 1

# Published and fetchable. Repacked from upstream's official prebuilt
# LLVM-20.1.8-Linux-X64.tar.xz rather than built from source like the mac
# stage; see the release notes for the relocatability exemption that carries,
# and eseq-linux.49 for the from-source rebuild that retires it.
target.x86_64-unknown-linux-gnu.archive dgen-toolchain-20.1.8-x86_64.tar.gz
target.x86_64-unknown-linux-gnu.archive_sha256 5b0059868f3a65e64e5641a0bb03d04429334eae0513091e0ee28c96d980b2d3
target.x86_64-unknown-linux-gnu.url https://github.com/universalsequences/dgen-audio/releases/download/dgen-toolchain-20.1.8/dgen-toolchain-20.1.8-x86_64.tar.gz
target.x86_64-unknown-linux-gnu.llvm_version 20.1.8
target.x86_64-unknown-linux-gnu.dgen_abi_version 1
