# The debug ESeqLisp compiler and scheduler need the repository's documented
# 16 MiB stack budget. Cargo propagates this to libtest/nextest processes, so a
# stack overflow is reported against the named test instead of aborting an
# otherwise unrelated test binary. See `sequencer::REQUIRED_THREAD_STACK_SIZE`
# and bead eseq-4tl.1 (iterative compiler traversal).
[env]
RUST_MIN_STACK = { value = "16777216", force = false }
# clap-wrapper (the plugin shell's VST3 layer, crates/eseq-plugin) logs every
# factory/instance call to stderr unless NDEBUG, which the `cc` crate never
# defines. No other C++ in the workspace reads this macro.
CXXFLAGS = { value = "-DCLAP_WRAPPER_LOGLEVEL=0", force = false }
