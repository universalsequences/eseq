[workspace]
members = [
    "crates/eseq-plugin",
    "crates/eseq-plugin-format",
    "crates/eseq-voice-mod",
    "crates/eseqlisp",
    "crates/musicplayer",
    "crates/sequencer",
]
resolver = "3"

[patch.crates-io]
aubio-sys = { path = "vendor/aubio-sys-0.2.1" }
cpal = { path = "vendor/cpal-0.15.3" }

[profile.release]
debug = true
strip = "none"
split-debuginfo = "packed"
