[package]
name = "eseqlisp"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
autoexamples = false

[features]
patcher-test-support = []
wgpu = ["dep:wgpu"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
rustc_lexer = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
etagere = "0.2"
winit = "0.29"
wgpu = { version = "24", optional = true }

[dev-dependencies]
naga = { version = "24", features = ["wgsl-in"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-metal = { version = "0.3", features = [
    "MTLDevice",
    "MTLCommandQueue",
    "MTLCommandBuffer",
    "MTLRenderCommandEncoder",
    "MTLRenderPass",
    "MTLTexture",
    "MTLDrawable",
    "MTLLibrary",
    "MTLRenderPipeline",
    "MTLBuffer",
] }
objc2-quartz-core = { version = "0.3", features = ["CAMetalLayer"] }
objc2-app-kit = { version = "0.3", features = ["NSView", "NSWindow", "NSColor", "NSResponder", "NSAppearance", "NSHapticFeedback"] }
objc2-core-foundation = { version = "0.3", features = ["CFAttributedString", "CFDictionary"] }
objc2-core-text = { version = "0.3", features = ["CTFont", "CTFontDescriptor", "CTLine", "CTStringAttributes"] }
objc2-core-graphics = { version = "0.3", features = [
    "CGBitmapContext",
    "CGColorSpace",
    "CGContext",
    "CGImage",
] }

[[example]]
name = "embed"
path = "examples/embed.rs"

[[example]]
name = "metal_window"
path = "examples/metal_window.rs"

[[example]]
name = "piano_roll_embed"
path = "examples/piano_roll_embed.rs"

[[example]]
name = "piano_roll_embed_metal"
path = "examples/piano_roll_embed_metal.rs"
