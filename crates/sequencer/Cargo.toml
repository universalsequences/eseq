[package]
name = "sequencer"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
crossterm = "0.28"
cpal = "0.15"
hound = "3.5"
sha2 = "0.10"
rustfft = "6.2"
symphonia = { version = "0.5", default-features = false, features = ["aiff", "flac", "mp3", "pcm", "wav"] }
aubio = { version = "0.2.1", default-features = false, features = ["bindgen", "builtin"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.31", features = ["bundled"] }
backtrace = "0.3"
object = { version = "0.37", default-features = false, features = ["read_core", "macho", "std"] }
libc = "0.2"
eseqlisp = { path = "../eseqlisp" }
arrayvec = "0.7"
notify = "6"

[lib]
name = "sequencer"
path = "src/lib.rs"

[[bin]]
name = "metal_seq"
path = "src/ui/main.rs"

[build-dependencies]
cc = "1.0"

[dev-dependencies]
eseqlisp = { path = "../eseqlisp", features = ["patcher-test-support"] }
