[package]
name = "sequencer"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
cpal = "0.15"
hound = "3.5"
aubio = { version = "0.2.1", default-features = false, features = ["bindgen", "builtin"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
unicode-width = "0.2"
backtrace = "0.3"
libc = "0.2"
eseqlisp = { path = "../eseqlisp" }
arrayvec = "0.7"
notify = "6"

[lib]
name = "sequencer"
path = "src/lib.rs"

[[bin]]
name = "sequencer"
path = "src/main.rs"

[[bin]]
name = "metal_seq"
path = "src/bin/metal_seq/main.rs"

[build-dependencies]
cc = "1.0"

[dev-dependencies]
eseqlisp = { path = "../eseqlisp", features = ["patcher-test-support"] }
