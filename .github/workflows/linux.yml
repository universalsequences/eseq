name: Linux

# The Linux target is a port (see epic eseq-linux), so it rots silently unless
# something builds and tests it on every change. This job is that something.
#
# It runs the same command the Linux workstation baseline is recorded against
# in docs/linux-validation.md, so a green run here and a green run there mean
# the same thing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A CI runner has no GPU. Mesa's lavapipe answers as a `Cpu` adapter, which
  # the startup check in ui/gpu_adapter.rs rejects on purpose; the tests that
  # touch wgpu are headless captures where a software rasterizer is the correct
  # thing to run on, so opt in explicitly rather than weakening the check.
  ESEQ_ALLOW_GPU_FALLBACK: "1"

jobs:
  test:
    name: x86_64-unknown-linux-gnu
    runs-on: ubuntu-24.04
    # The workspace suite is large (~4.5k tests) and the debug build of the
    # ESeqLisp compiler is not fast.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev \
            libpipewire-0.3-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            mesa-vulkan-drivers \
            fonts-jetbrains-mono
        # libasound2-dev is cpal's ALSA backend; libpipewire-0.3-dev exposes
        # the active graph clock so PipeWire ALSA clients avoid resampling.
        # The X11/Wayland/xkbcommon headers are what winit links against even
        # in a headless test build.
        # mesa-vulkan-drivers provides lavapipe so the headless wgpu captures
        # find an adapter instead of skipping. fonts-jetbrains-mono is not
        # optional: glyph metrics come from `fontdb`'s system font database and
        # several layout tests measure against that exact family.

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Keyed on the feature set so a wgpu-enabled cache is never reused for
          # a build without it.
          key: wgpu

      - uses: taiki-e/install-action@nextest

      - name: Fetch the pinned DGenLisp compiler and toolchain
        run: |
          ./scripts/fetch_dgenlisp.sh
          ./scripts/fetch_dgen_toolchain.sh
        # Neither the compiler nor its clang stage is tracked in git; both are
        # pinned by sha256 in content/dgenlisp.lock and
        # content/dgen-toolchain.lock. Anything that compiles a DGen patch
        # hard-fails without them, so this step is a prerequisite of the suite
        # rather than an optimization.

      - name: Build and check the workspace
        run: cargo check --workspace --all-targets --features eseqlisp/wgpu

      - name: Test
        run: cargo nextest run --workspace --features eseqlisp/wgpu
        # RUST_MIN_STACK comes from .cargo/config.toml; do not set it here.
