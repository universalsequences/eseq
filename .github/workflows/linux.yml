name: CI

# The Linux target is a port (see epic eseq-linux), so it rots silently unless
# something builds and tests it on every change. The `test` job is that
# something.
#
# It runs the same command the Linux workstation baseline is recorded against
# in docs/linux-validation.md, so a green run here and a green run there mean
# the same thing.
#
# The same argument now cuts the other way: the port also reshaped the macOS
# build (the DGenLisp compiler is fetched instead of tracked, eseqlisp's objc2
# feature set was pruned, clip/scissor geometry moved into the shared
# ui::gpu_geometry the Metal encoder calls, and [patch.crates-io] aubio-sys
# applies there too), and that half is validated only by hand-run sessions in
# docs/linux-validation.md. The `macos-check` job covers it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A CI runner has no GPU. Mesa's lavapipe answers as a `Cpu` adapter, which
  # the startup check in ui/gpu_adapter.rs rejects on purpose; the tests that
  # touch wgpu are headless captures where a software rasterizer is the correct
  # thing to run on, so opt in explicitly rather than weakening the check.
  ESEQ_ALLOW_GPU_FALLBACK: "1"

jobs:
  test:
    name: x86_64-unknown-linux-gnu
    runs-on: ubuntu-24.04
    # The workspace suite is large (~4.5k tests) and the debug build of the
    # ESeqLisp compiler is not fast.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev \
            libpipewire-0.3-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            mesa-vulkan-drivers \
            fonts-jetbrains-mono
        # libasound2-dev is cpal's ALSA backend; libpipewire-0.3-dev exposes
        # the active graph clock so PipeWire ALSA clients avoid resampling.
        # The X11/Wayland/xkbcommon headers are what winit links against even
        # in a headless test build.
        # mesa-vulkan-drivers provides lavapipe so the headless wgpu captures
        # find an adapter instead of skipping. fonts-jetbrains-mono is not
        # optional: glyph metrics come from `fontdb`'s system font database and
        # several layout tests measure against that exact family.

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Keyed on the feature set so a wgpu-enabled cache is never reused for
          # a build without it.
          key: wgpu-capture-harness

      - uses: taiki-e/install-action@nextest

      - name: Fetch the pinned DGenLisp compiler and toolchain
        run: |
          ./scripts/fetch_dgenlisp.sh
          ./scripts/fetch_dgen_toolchain.sh
        # Neither the compiler nor its clang stage is tracked in git; both are
        # pinned by sha256 in content/dgenlisp.lock and
        # content/dgen-toolchain.lock. Anything that compiles a DGen patch
        # hard-fails without them, so this step is a prerequisite of the suite
        # rather than an optimization.

      - name: Build and check the workspace
        run: cargo check --workspace --all-targets --features eseqlisp/wgpu,eseqlisp/capture-harness

      - name: Test
        run: cargo nextest run --workspace --features eseqlisp/wgpu,eseqlisp/capture-harness
        # RUST_MIN_STACK comes from .cargo/config.toml; do not set it here.

  macos-check:
    name: aarch64-apple-darwin
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-capture-harness

      - name: Fetch the pinned DGenLisp compiler
        run: ./scripts/fetch_dgenlisp.sh
        # Only the compiler, not the clang stage: content/dgen-toolchain.lock
        # pins arm64-apple-macos by sha256 but publishes no url for it, so
        # scripts/fetch_dgen_toolchain.sh hard-fails on a fresh runner and the
        # toolchain has to be vendored from a local dgen-audio checkout. That
        # is why this job stops at `cargo check`: running the suite here is
        # blocked until a target.arm64-apple-macos.url is published.

      - name: Check the workspace
        run: cargo check --workspace --all-targets --features eseqlisp/capture-harness
        # Check-only still catches what this branch put at risk on macOS: cfg
        # gates, the pruned objc2 feature set, ui::gpu_geometry drifting away
        # from the Metal encoder, and the aubio-sys patch.
